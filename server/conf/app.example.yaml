# app 用于描述服务自身的基础启动信息。
app:
  # 服务名称，用于日志、监控和部署识别。
  name: papermind
  # 运行环境标识，常用值为 dev、test、prod。
  env: dev
  # Gin HTTP 服务监听端口。
  http_port: 9080
  # 对外访问地址，用于生成回调地址、文件访问地址和前端展示链接。
  public_url: http://localhost:9080

# database 用于配置 GORM 数据库连接。
database:
  # 数据库驱动类型，首版支持 sqlite、mysql、postgres。
  driver: sqlite
  # 数据库连接字符串；SQLite 必须开启外键、WAL 和 busy timeout。
  dsn: file:server/data/sqlite/papermind.db?_foreign_keys=on&_journal_mode=WAL&_busy_timeout=5000
  # 最大打开连接数；SQLite 默认 1，PostgreSQL/MySQL 按部署规模调整。
  max_open_conns: 1
  # 最大空闲连接数；SQLite 默认 1，PostgreSQL/MySQL 按部署规模调整。
  max_idle_conns: 1

# auth 用于配置登录 token 和考试 token 的有效期。
auth:
  # 普通登录 access token 有效期，单位为秒。
  access_token_ttl: 7200
  # 普通登录 refresh token 有效期，单位为秒。
  refresh_token_ttl: 604800
  # 考试 token 物理过期缓冲时间，单位为分钟；业务作答截止时间仍单独硬校验。
  exam_token_buffer_minutes: 30
  # session 保存登录主体信息；支持 memory 和 redis。
  session:
    # session provider，可选 memory 或 redis。
    provider: memory
    # session 签名密钥；留空时启动进程会随机生成，生产环境建议通过环境变量注入。
    secret: ""
    # session 有效期，单位为秒；默认与 refresh token 有效期保持一致。
    ttl: 604800
    # session key 前缀，Redis provider 用于隔离不同环境。
    key_prefix: papermind:session
    # 内存 session 过期清理间隔，单位为秒。
    cleanup_interval: 300
    # Redis provider 连接配置；memory 模式不会连接 Redis。
    redis:
      addr: 127.0.0.1:6379
      username: ""
      password: ""
      db: 0

# storage 用于配置运行期文件目录。
storage:
  # 临时文件目录，启动时会校验目录存在且可写。
  temp_dir: server/data/tmp
  # 导入文件目录，题库导入等上传文件会进入该目录或其子目录。
  import_dir: server/data/imports
  # 导出文件目录，成绩导出等生成文件会进入该目录或其子目录。
  export_dir: server/data/exports

# security 用于配置平台级安全默认值。
security:
  # 新租户是否默认允许用户自注册；租户创建时继承该默认值。
  allow_register_default: false
  # 用户密码最小长度。
  password_min_length: 8
  # 允许跨域访问的前端地址列表。
  cors_origins:
    # 本地 Vite 开发服务地址。
    - http://localhost:5173
